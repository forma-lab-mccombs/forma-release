name: CI

on:
  push:
  pull_request:

# The companion benchmark package (`proforma-20q`) is a source install, and its
# repository URL is deliberately NOT written in this file: this repo mirrors for
# double-blind review, so no organisation URL may appear in file contents.
# Instead set, in repository settings:
#
#   variable  COMPANION_REPO_URL  = https://github.com/<org>/proforma-20q
#   secret    COMPANION_TOKEN     = a read-only token, only while that repo is private
#
# Settings are not files, so neither is ever mirrored. When both are absent the
# companion-dependent steps skip with a notice and everything else still runs,
# so forks and mirrors stay green and honestly reported rather than silently
# hollow. Once `proforma-20q` is public / on PyPI, drop both and replace the
# install step with `pip install proforma-20q`.
env:
  COMPANION_REPO_URL: ${{ vars.COMPANION_REPO_URL }}

jobs:
  # Core = Forma inference only. This job installs NO competitor/LLM/chronos
  # extras and proves (a) the package imports without scikit-learn/xgboost/
  # lightgbm/chronos and (b) the scoring-math and (when the companion is
  # available) the WRDS-free synthetic pipeline smoke test pass on the core
  # stack alone.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check whether the companion package is reachable
        id: companion
        run: |
          if [ -n "${COMPANION_REPO_URL}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COMPANION_REPO_URL is not set, so the synthetic pipeline smoke test (which needs proforma-20q) is skipped. Everything else still runs. See this file's header to enable it."
          fi

      - name: Install companion benchmark package (source)
        if: steps.companion.outputs.available == 'true'
        env:
          COMPANION_TOKEN: ${{ secrets.COMPANION_TOKEN }}
        run: |
          if [ -n "${COMPANION_TOKEN}" ]; then
            # Private companion: authenticate without putting the URL in the repo.
            pip install "proforma-20q @ git+https://x-access-token:${COMPANION_TOKEN}@${COMPANION_REPO_URL#https://}"
          else
            pip install "proforma-20q @ git+${COMPANION_REPO_URL}"
          fi

      - name: Install forma-release (core + dev only)
        run: pip install -e ".[dev]"

      - name: Core import must not pull competitor/LLM libraries
        run: |
          python - <<'PY'
          import sys, forma
          from forma.models import FormaModel, BaseModel
          from forma.scoring import evaluate, eval_cache
          from forma.data import config_utils  # torch-free decoupling
          for lib in ("sklearn", "xgboost", "lightgbm", "anthropic", "duckdb"):
              assert lib not in sys.modules, f"core install leaked {lib}"
          print("core import OK; version", forma.__version__)
          PY

      - name: Scoring-math and packaging tests (no companion needed)
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_llm_harness.py \
            --ignore=tests/test_synthetic_smoke.py

      - name: Synthetic pipeline smoke test (needs the companion)
        if: steps.companion.outputs.available == 'true'
        run: python -m pytest tests/test_synthetic_smoke.py -q

  # The LLM harness needs the [llm] extra (httpx). Kept separate so it never
  # constrains the core install.
  llm-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install forma-release with the LLM extra
        run: pip install -e ".[llm,dev]"
      - name: LLM harness loads + parses (no network)
        run: python -m pytest tests/test_llm_harness.py -q
