# Chronos-2 raw-context benchmark -- FULL-HISTORY ABLATION of chronos2_raw12q.yaml.
# Identical to the v2 benchmark config except max_context: 200 (effectively the
# firm's whole history, v1's information set) and the forecast/model name.
# Purpose: quantify the value of history beyond Forma's 12-quarter window --
# chronos_rawfull vs chronos_raw isolates the information-set effect with the
# input space, output transform, and eval cells held fixed. Also evidence for
# whether a longer Forma lookback is worth a future round.
#
#   python -m forma.train --config configs/chronos2_rawfull.yaml --model-only chronos_raw --forecast-splits test
experiment:
  name: "chronos2_rawfull"
  description: "Chronos-2 zero-shot raw-context ablation: full history (max_context 200) vs the 12q Forma-parity benchmark."

seed: 0

inference:
  reconcile: false
  save_sigma: true
  seed_in_forecast_name: false

data:
  feature_set: "pf_full"
  dataset_tag: "r13_node_optionD_indfe_val8"   # reuse the R13 build; do NOT rebuild.
  raw_path: "data/raw/compustat_with_permno.parquet"
  processed_dir: "data/processed"
  feature_sets_config: "configs/feature_sets.yaml"
  batch_size: 32
  num_workers: 8
  predict_batch_size: 32
  time_splits:
    train_end_year: 2001
    val_end_year: 2009
  firm_id_map_path: "data/processed/firm_id_map.csv"
  account_id_map_path: "data/processed/account_id_map.csv"
  industry_id_map_path: "data/processed/industry_id_map.csv"
  industry_mode: "node"
  tabular_industry_fe: true
  no_cv: true

  sector_exclusions:
    sic_ranges:
      - start: 6000
        end: 6999

  feature_engineering:
    forecast_horizon: 20
    min_lookback: 4
    recent_levels: 4
    yoy_changes: 8

  targets:
    all: true
    present_in_q0: true
    variables:
    - "niq"
    - "revtq"
    - "cogsq"
    - "oiadpq"
    - "dpq"
    - "gpq"
    - "cheq"
    - "ppentq"
    - "ltq"
    - "seqq"
    - "dlttq"

results_dir: "results/forecasts"
stop_on_error: true

models:
  chronos_raw:
    type: "chronos_raw"
    parameters:
      model_name: "chronos_rawfull"     # distinct forecast family vs the 12q benchmark.
      model_id: "amazon/chronos-2"
      device: "auto"
      torch_dtype: "auto"
      sigma_method: "grid"
      sigma_quantile_pair: [0.1, 0.9]   # used only when sigma_method: "pair"
      max_context: 200                   # v1's information set (full firm history).
      batch_size: 256
      forecast_horizon: 20
      point_stat: "mean"
      write_median_sibling: true
      max_abs_zscore: 6.0
