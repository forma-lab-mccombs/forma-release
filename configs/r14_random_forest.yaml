# RANDOM FOREST (sklearn/cuML GPU) - single seed (62). Same design matrix as
# r14_baselines; reuses the camera-ready build (tag `r14_node_optionD_indfe_val8`) - do NOT rebuild.
#
# no_cv:false so the per-horizon (n_estimators, max_depth, min_samples_split)
# search has the 2002-2009 val fold; final model refits on train+val (1971-2009).
# VENUE: an x86 GPU host with a working cuML build. R13 took ~40 h on an
# H100; budget ~47 h for the camera-ready build's +17% raw rows vs R13
# (292,812 / 1,708,447; the trim removed 14.63% of the untrimmed panel).
# Watch host RAM (RF fit() holds every forest).
#
#   python -m forma.train --config configs/r14_random_forest.yaml --forecast-splits test
experiment:
  name: "r14_random_forest"
  description: "Random Forest baseline (cuML GPU) on the canonical camera-ready build (pf_full, FF48 industry FE). Single seed 62; per-horizon hparams CV'd on the 8-year val fold."

seed: 62

inference:
  reconcile: false

trainer:
  select_best_by_val_loss: false

data:
  feature_set: "pf_full"
  dataset_tag: "r14_node_optionD_indfe_val8"   # canonical camera-ready build. Built ONCE by r14_baselines.yaml.
  # Camera-ready build: TOTAL kurtosis 3 (#285), untrimmed raw panel
  # (#286), own processed dir (id maps default to data/processed/*_id_map.csv).
  raw_path: "data/raw/compustat_fundq.parquet"   # untrimmed comp.fundq + co_industry panel; NOT the CRSP-trimmed compustat_with_permno.parquet.
  processed_dir: "data/processed"
  identities_path: "configs/identities.json"
  feature_sets_config: "configs/feature_sets.yaml"
  batch_size: 32
  num_workers: 8
  predict_batch_size: 32
  use_future_grid: false
  time_splits:
    train_end_year: 2001   # train 1971-2001; also the reg-stats estimation cutoff.
    val_end_year: 2009     # val 2002-2009 (8 years); test 2010+.
  industry_config_path: "configs/ff48_sic_ranges.json"
  industry_mode: "node"
  tabular_industry_fe: true   # FF48 dummies on the tabular matrix (baselines/FFNN). No-op for Forma (tuple-only).
  no_cv: false

  sector_exclusions:
    sic_ranges:
      - start: 6000
        end: 6999

  feature_engineering:
    k_target_total_kurtosis: 3.0   # CORRECTED target (#285): TOTAL/Pearson kurtosis 3. R13 pinned the legacy 6.0.
    tuple_max_abs_zscore: 6.0   # Forma runtime clamp (PR #138). Ignored by the tabular pipeline + make_dataset.
    reg_mu_scale_lag: 0
    reg_mu_feature_lags: [0]
    reg_sig_scale_lag: 4
    reg_sig_feature_lags: [0, 8]
    reg_k_scale_lag: 4
    reg_k_feature_lags: [0, 8]
    max_abs_zscore: 6.0
    min_lookback: 4
    recent_levels: 4
    yoy_changes: 8
    forecast_horizon: 20
    imputation:
        use: true
        n_factors: 10

  curriculum:
    max_epochs: 12
    min_horizon: 0
    initial_horizon: 4
    horizon_step: 4
    epochs_per_step: 1
    max_horizon: 20
    min_lookback: 4
    max_lookback: 12
    deterministic_forecast: true
    pro_forma_mask_probability: 0.5
    future_mask_probability: 0.95
    identity_group_mask_probability: 0.1
    ungrouped_mask_probability: 0.05

  targets:
    all: true
    present_in_q0: true
    variables:
    - "niq"
    - "revtq"
    - "cogsq"
    - "oiadpq"
    - "dpq"
    - "gpq"
    - "cheq"
    - "ppentq"
    - "ltq"
    - "seqq"
    - "dlttq"

results_dir: "results/forecasts"
stop_on_error: true

models:
  random_forest:
    type: "sklearn"
    parameters:
      sklearn_type: "random_forest"
      random_state: 62
      n_jobs: -1            # sklearn CPU-fallback only; ignored by cuML.
      max_samples: 0.5      # bootstrap 50% of rows per tree.
      min_samples_leaf: 25
      shared_horizon_hparams: true
      hparam_reference_target: "niq"
      hyperparameter_grid:
        n_estimators: [ 50, 100, 200 ]
        max_depth: [ 5, 10, 20 ]
        min_samples_split: [ 100, 200 ]
