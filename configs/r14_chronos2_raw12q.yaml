# CHRONOS-2 zero-shot, raw tuple context (12q, Forma parity). No training:
# inference only, but it reads the camera-ready tuple files and reg stats, so it
# must be re-run on the camera-ready build. Writes chronos_raw (mean), chronos_raw_med (median
# sibling) and the __quantiles sibling the Panel C CRPS/coverage pass needs (#246).
#
#   python -m forma.train --config configs/r14_chronos2_raw12q.yaml --forecast-splits test
experiment:
  name: "r14_chronos2_raw12q"
  description: "Chronos-2 zero-shot: raw tuple context (12q), origin-frozen target-space outputs, mean+median point files + quantiles, canonical camera-ready build."

seed: 0

inference:
  reconcile: false
  save_sigma: true             # raw (unfloored) Gaussian-equivalent sigma; floor is evaluate.py --sigma-floor.
  seed_in_forecast_name: false # single zero-shot forecast -> 4-segment {model}__{fs}__{split} name.

data:
  feature_set: "pf_full"
  dataset_tag: "r14_node_optionD_indfe_val8"   # reuse the canonical build; do NOT rebuild.
  # Camera-ready build: TOTAL kurtosis 3 (#285), untrimmed raw panel
  # (#286), own processed dir (id maps default to data/processed/*_id_map.csv).
  raw_path: "data/raw/compustat_fundq.parquet"
  processed_dir: "data/processed"
  feature_sets_config: "configs/feature_sets.yaml"
  batch_size: 32
  num_workers: 8
  predict_batch_size: 32
  time_splits:
    train_end_year: 2001
    val_end_year: 2009
  industry_mode: "node"
  tabular_industry_fe: true
  no_cv: true
  sector_exclusions:
    sic_ranges:
      - start: 6000
        end: 6999
  feature_engineering:
    k_target_total_kurtosis: 3.0
    forecast_horizon: 20
    min_lookback: 4
    recent_levels: 4
    yoy_changes: 8
  targets:
    all: true
    present_in_q0: true
    variables:
    - "niq"
    - "revtq"
    - "cogsq"
    - "oiadpq"
    - "dpq"
    - "gpq"
    - "cheq"
    - "ppentq"
    - "ltq"
    - "seqq"
    - "dlttq"

results_dir: "results/forecasts"
stop_on_error: true

models:
  chronos_raw:
    type: "chronos_raw"
    parameters:
      model_id: "amazon/chronos-2"      # Apache-2.0; requires the Chronos-2 pipeline (NaN masking + list API).
      device: "auto"
      torch_dtype: "auto"
      sigma_method: "grid"               # moment-matched sigma from the full 21-level quantile grid.
      sigma_quantile_pair: [0.1, 0.9]    # used only when sigma_method: "pair".
      max_context: 12                    # Forma parity: 12 observations incl. origin ([Q-11, Q]).
      batch_size: 256
      forecast_horizon: 20
      point_stat: "mean"                 # primary file point: target-space mean (L2/R2-fair).
      write_median_sibling: true         # also write chronos_raw_med (median point, L1/MAE-fair).
      save_quantiles: true               # #246: persist the 21 native levels to a __quantiles.parquet sibling.
      max_abs_zscore: 6.0                # match the build's label clip.
