# FORMA (CANONICAL, leak-closed future grid) - Gaussian beta-NLL (beta=0.5),
# seed 60. Member of the 5-seed mixture (seeds [60, 61, 62, 63, 64]). Identical to
# the R13 (submission) r13_forma_fgrid_seed60.yaml except the camera-ready data block (corrected
# kurtosis target, untrimmed raw panel, own processed dir) -- and, in code,
# the deduplicated no_cv train+val union (#279).
#
#   python -m forma.train --config configs/r14_forma_fgrid_seed60.yaml --model-only forma --forecast-splits test
#
# Keep the checkpoint (<run_dir>/models/forma_fgrid.ckpt): the T2 reconciliation
# and F2 scenario exhibits are checkpoint inference.
experiment:
  name: "r14_forma_fgrid_seed60"
  description: "Forma CANONICAL leak-closed future-grid, Gaussian beta-NLL (beta=0.5), seed 60; 5-seed mixture member on the canonical camera-ready build. fp32, seed-aware forecast name, forecast_name=forma_fgrid."

seed: 60

inference:
  reconcile: false
  save_sigma: true
  fp32: true                  # de-quantize forecasts (PR #154); matches the fp32 likelihood pool.
  seed_in_forecast_name: true # 5-segment {model}__{fs}__{seed}__{split} name -> eval mixture family.

trainer:
  select_best_by_val_loss: false
  gradient_clip_val: 1.0

data:
  feature_set: "pf_full"
  dataset_tag: "r14_node_optionD_indfe_val8"   # canonical camera-ready build. Built ONCE by r14_baselines.yaml.
  # Camera-ready build: TOTAL kurtosis 3 (#285), untrimmed raw panel
  # (#286), own processed dir (id maps default to data/processed/*_id_map.csv).
  raw_path: "data/raw/compustat_fundq.parquet"   # untrimmed comp.fundq + co_industry panel; NOT the CRSP-trimmed compustat_with_permno.parquet.
  processed_dir: "data/processed"
  identities_path: "configs/identities.json"
  feature_sets_config: "configs/feature_sets.yaml"
  batch_size: 32
  num_workers: 8
  predict_batch_size: 32
  use_future_grid: true                 # leak-closed future grid ON (canonical fgrid Forma).
  future_grid_sample_overhang: false    # cut the ex-ante data-end overhang, keep within-period survivorship coverage (r7e2, #85).
  time_splits:
    train_end_year: 2001   # train 1971-2001; also the reg-stats estimation cutoff.
    val_end_year: 2009     # val 2002-2009 (8 years); test 2010+.
  industry_config_path: "configs/ff48_sic_ranges.json"
  industry_mode: "node"
  tabular_industry_fe: true   # FF48 dummies on the tabular matrix (baselines/FFNN). No-op for Forma (tuple-only).
  no_cv: true

  sector_exclusions:
    sic_ranges:
      - start: 6000
        end: 6999

  feature_engineering:
    k_target_total_kurtosis: 3.0   # CORRECTED target (#285): TOTAL/Pearson kurtosis 3. R13 pinned the legacy 6.0.
    tuple_max_abs_zscore: 6.0   # Forma runtime clamp (PR #138). Ignored by the tabular pipeline + make_dataset.
    reg_mu_scale_lag: 0
    reg_mu_feature_lags: [0]
    reg_sig_scale_lag: 4
    reg_sig_feature_lags: [0, 8]
    reg_k_scale_lag: 4
    reg_k_feature_lags: [0, 8]
    max_abs_zscore: 6.0
    min_lookback: 4
    recent_levels: 4
    yoy_changes: 8
    forecast_horizon: 20
    imputation:
        use: true
        n_factors: 10

  curriculum:
    max_epochs: 12
    min_horizon: 0
    initial_horizon: 4
    horizon_step: 4
    epochs_per_step: 1
    max_horizon: 20
    min_lookback: 4
    max_lookback: 12
    deterministic_forecast: true
    pro_forma_mask_probability: 0.5
    future_mask_probability: 0.95
    identity_group_mask_probability: 0.1
    ungrouped_mask_probability: 0.05

  targets:
    all: true
    present_in_q0: true
    variables:
    - "niq"
    - "revtq"
    - "cogsq"
    - "oiadpq"
    - "dpq"
    - "gpq"
    - "cheq"
    - "ppentq"
    - "ltq"
    - "seqq"
    - "dlttq"

results_dir: "results/forecasts"
stop_on_error: true

models:
  forma:
    type: "forma"
    forecast_name: "forma_fgrid"   # same {model} id as the R13 (submission) run, so the family key is unchanged.
    parameters:
      n_layers: 4
      d_model: 128
      n_heads: 4
      d_ff: 512
      dropout: 0.2
      lr: 1e-4
      loss_type: 'gaussian'
      student_t_df: 6.0
      weight_decay: 0.1
      constraint_mode: 'none'
      use_temporal_bias: false
      use_same_account_bias: false
      beta_nll: 0.5
