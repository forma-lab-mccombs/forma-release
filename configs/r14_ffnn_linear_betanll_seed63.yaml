# FFNN LINEAR beta-NLL (beta=0.5), seed 63. Member of the 5-seed
# linear mixture (seeds [60, 61, 62, 63, 64]). dropout-0.10 recipe, wd 0.0. no_cv:true -> refits
# on train+val (1971-2009) for a FIXED `epochs`.
# epochs=8 from r14_ffnn_betanll_cv (ffnn_linear_b50 best-val epoch).
#
#   python -m forma.train --config configs/r14_ffnn_linear_betanll_seed63.yaml --forecast-splits test
experiment:
  name: "r14_ffnn_linear_betanll_seed63"
  description: "FFNN linear Gaussian beta-NLL (beta=0.5), seed 63; 5-seed mixture member on the canonical camera-ready build. Epochs from the CV run; seed-aware forecast name."

seed: 63               # top-level seed -> forecast seed token (must match parameters.seed below).

inference:
  reconcile: false
  save_sigma: true
  seed_in_forecast_name: true

trainer:
  select_best_by_val_loss: false

data:
  feature_set: "pf_full"
  dataset_tag: "r14_node_optionD_indfe_val8"   # canonical camera-ready build. Built ONCE by r14_baselines.yaml.
  # Camera-ready build: TOTAL kurtosis 3 (#285), untrimmed raw panel
  # (#286), own processed dir (id maps default to data/processed/*_id_map.csv).
  raw_path: "data/raw/compustat_fundq.parquet"   # untrimmed comp.fundq + co_industry panel; NOT the CRSP-trimmed compustat_with_permno.parquet.
  processed_dir: "data/processed"
  identities_path: "configs/identities.json"
  feature_sets_config: "configs/feature_sets.yaml"
  batch_size: 32
  num_workers: 8
  predict_batch_size: 32
  use_future_grid: false
  time_splits:
    train_end_year: 2001   # train 1971-2001; also the reg-stats estimation cutoff.
    val_end_year: 2009     # val 2002-2009 (8 years); test 2010+.
  industry_config_path: "configs/ff48_sic_ranges.json"
  industry_mode: "node"
  tabular_industry_fe: true   # FF48 dummies on the tabular matrix (baselines/FFNN). No-op for Forma (tuple-only).
  no_cv: true

  sector_exclusions:
    sic_ranges:
      - start: 6000
        end: 6999

  feature_engineering:
    k_target_total_kurtosis: 3.0   # CORRECTED target (#285): TOTAL/Pearson kurtosis 3. R13 pinned the legacy 6.0.
    tuple_max_abs_zscore: 6.0   # Forma runtime clamp (PR #138). Ignored by the tabular pipeline + make_dataset.
    reg_mu_scale_lag: 0
    reg_mu_feature_lags: [0]
    reg_sig_scale_lag: 4
    reg_sig_feature_lags: [0, 8]
    reg_k_scale_lag: 4
    reg_k_feature_lags: [0, 8]
    max_abs_zscore: 6.0
    min_lookback: 4
    recent_levels: 4
    yoy_changes: 8
    forecast_horizon: 20
    imputation:
        use: true
        n_factors: 10

  curriculum:
    max_epochs: 12
    min_horizon: 0
    initial_horizon: 4
    horizon_step: 4
    epochs_per_step: 1
    max_horizon: 20
    min_lookback: 4
    max_lookback: 12
    deterministic_forecast: true
    pro_forma_mask_probability: 0.5
    future_mask_probability: 0.95
    identity_group_mask_probability: 0.1
    ungrouped_mask_probability: 0.05

  targets:
    all: true
    present_in_q0: true
    variables:
    - "niq"
    - "revtq"
    - "cogsq"
    - "oiadpq"
    - "dpq"
    - "gpq"
    - "cheq"
    - "ppentq"
    - "ltq"
    - "seqq"
    - "dlttq"

results_dir: "results/forecasts"
stop_on_error: true

models:
  ffnn_linear_b50:
    type: "ffnn"
    parameters:
      hidden_dims: []
      activation: gelu
      dropout: 0.1
      lr: 1e-4
      weight_decay: 0.0
      epochs: 8
      batch_size: 1024
      early_stopping_patience: 10
      loss_normalization: global
      loss_type: gaussian
      beta_nll: 0.5
      student_t_df: 6.0
      log_sigma_sq_min: -10.0
      log_sigma_sq_max: 10.0
      seed: 63
