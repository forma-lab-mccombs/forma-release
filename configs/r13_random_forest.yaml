# RANDOM FOREST (sklearn/cuML GPU) - single seed (62). RF is itself an
# ensemble, so one seed is the "mixture". Same design matrix as r13_baselines
# (FF48 industry FE, Option-D reg-stats); reuses the canonical dataset (tag `r13_node_optionD_indfe_val8`) -
# do NOT rebuild. Re-run vs r9e2 is needed only because the 8-year val fold
# changes the per-horizon hparam search.
#
# no_cv:false so the per-horizon (n_estimators, max_depth, min_samples_split)
# search has the 2002-2009 val fold; final model refits on train+val (1971-2009).
# VENUE: run on an x86 GPU host with a working cuML build - cuML GPU path or it
# falls back to slow sklearn CPU. Budget ~40h on an H100. Pre-flight cuML accepts
# min_samples_split before submitting.
#
#   python -m forma.train --config configs/r13_random_forest.yaml --forecast-splits test
experiment:
  name: "r13_random_forest"
  description: "Random Forest baseline (cuML GPU) on the canonical 8-year-val build (pf_full, FF48 industry FE). Single seed 62; per-horizon hparams CV'd on the 8-year val fold."

seed: 62

inference:
  reconcile: false

trainer:
  select_best_by_val_loss: false

data:
  feature_set: "pf_full"
  dataset_tag: "r13_node_optionD_indfe_val8"   # canonical 8-year-val rebuild; train_end_year=2001 also moves the reg-stats cutoff. Build ONCE (see header).
  raw_path: "data/raw/compustat_with_permno.parquet"
  processed_dir: "data/processed"
  identities_path: "configs/identities.json"
  feature_sets_config: "configs/feature_sets.yaml"
  batch_size: 32
  num_workers: 8
  predict_batch_size: 32
  use_future_grid: false
  time_splits:
    train_end_year: 2001   # train 1971-2001 (extended); also the reg-stats estimation cutoff.
    val_end_year: 2009     # val 2002-2009 (8 years); test 2010+ unchanged.
  firm_id_map_path: "data/processed/firm_id_map.csv"
  account_id_map_path: "data/processed/account_id_map.csv"
  industry_id_map_path: "data/processed/industry_id_map.csv"
  industry_config_path: "configs/ff48_sic_ranges.json"
  industry_mode: "node"
  tabular_industry_fe: true   # FF48 dummies on the tabular matrix (baselines/FFNN). No-op for Forma (tuple-only).
  no_cv: false

  sector_exclusions:
    sic_ranges:
      - start: 6000
        end: 6999

  feature_engineering:
    tuple_max_abs_zscore: 6.0   # Forma runtime clamp (PR #138). Ignored by the tabular pipeline + make_dataset.
    reg_mu_scale_lag: 0
    reg_mu_feature_lags: [0]
    reg_sig_scale_lag: 4
    reg_sig_feature_lags: [0, 8]
    reg_k_scale_lag: 4
    reg_k_feature_lags: [0, 8]
    max_abs_zscore: 6.0
    min_lookback: 4
    recent_levels: 4
    yoy_changes: 8
    forecast_horizon: 20
    imputation:
        use: true
        n_factors: 10

  curriculum:
    max_epochs: 12
    min_horizon: 0
    initial_horizon: 4
    horizon_step: 4
    epochs_per_step: 1
    max_horizon: 20
    min_lookback: 4
    max_lookback: 12
    deterministic_forecast: true
    pro_forma_mask_probability: 0.5
    future_mask_probability: 0.95
    identity_group_mask_probability: 0.1
    ungrouped_mask_probability: 0.05

  targets:
    all: true
    present_in_q0: true
    variables:
    - "niq"
    - "revtq"
    - "cogsq"
    - "oiadpq"
    - "dpq"
    - "gpq"
    - "cheq"
    - "ppentq"
    - "ltq"
    - "seqq"
    - "dlttq"

results_dir: "results/forecasts"
stop_on_error: true

models:
  random_forest:
    type: "sklearn"
    parameters:
      sklearn_type: "random_forest"
      random_state: 62
      n_jobs: -1            # sklearn CPU-fallback only; ignored by cuML.
      max_samples: 0.5      # bootstrap 50% of rows per tree.
      min_samples_leaf: 25
      shared_horizon_hparams: true
      hparam_reference_target: "niq"
      hyperparameter_grid:
        n_estimators: [ 50, 100, 200 ]
        max_depth: [ 5, 10, 20 ]
        min_samples_split: [ 100, 200 ]
